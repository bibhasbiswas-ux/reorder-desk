<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<style>body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style>
<title>Reorder Desk</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@500;600;700&family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&display=swap">
<style>
/* Layout: a despatch ledger. Five uploads feed one master file; orders fall out per depot from cover days. Summary strip, then tabs. */
:root{
  --s1:#2a78d6;--s2:#eb6834;--s3:#1baf7a;--s4:#eda100;--s5:#e87ba4;--s6:#008300;--s7:#6250d6;--s8:#898781;--dpos:#2a78d6;--dneg:#e34948;--vgrid:#e1e0d9;--vaxis:#c3c2b7;--up:#006300;--down:#d03b3b;
  --bg:#f2f5f3; --surface:#ffffff; --sunk:#e8edea; --line:#d3dbd6; --ink:#16211d; --muted:#5c6b65;
  --accent:#0d6a5b; --accent-ink:#ffffff; --accent-soft:#dcefe9;
  --crit:#b92d1c; --crit-soft:#fbe3df; --warn:#a05c00; --warn-soft:#fbecd2; --ok:#2c7a4b; --ok-soft:#dff1e5;
  --display:"Archivo","Arial Narrow",Arial,sans-serif; --body:"IBM Plex Sans","Segoe UI",system-ui,sans-serif; --mono:"IBM Plex Mono",ui-monospace,Menlo,Consolas,monospace;
  --r:6px;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --s1:#3987e5;--s2:#d95926;--s3:#199e70;--s4:#c98500;--s5:#d55181;--s6:#008300;--s7:#9085e9;--s8:#898781;--dpos:#3987e5;--dneg:#e66767;--vgrid:#2c2c2a;--vaxis:#383835;--up:#0ca30c;--down:#ff8a78;
  --bg:#111815; --surface:#19231f; --sunk:#222e29; --line:#33423c; --ink:#e7eeea; --muted:#9aaba4;
  --accent:#4fc3ac; --accent-ink:#06211c; --accent-soft:#17362f;
  --crit:#ff8a78; --crit-soft:#43201b; --warn:#f0b455; --warn-soft:#3d2e12; --ok:#7fd09c; --ok-soft:#1a3525; color-scheme:dark}}
:root[data-theme="dark"]{
  --s1:#3987e5;--s2:#d95926;--s3:#199e70;--s4:#c98500;--s5:#d55181;--s6:#008300;--s7:#9085e9;--s8:#898781;--dpos:#3987e5;--dneg:#e66767;--vgrid:#2c2c2a;--vaxis:#383835;--up:#0ca30c;--down:#ff8a78;
  --bg:#111815; --surface:#19231f; --sunk:#222e29; --line:#33423c; --ink:#e7eeea; --muted:#9aaba4;
  --accent:#4fc3ac; --accent-ink:#06211c; --accent-soft:#17362f;
  --crit:#ff8a78; --crit-soft:#43201b; --warn:#f0b455; --warn-soft:#3d2e12; --ok:#7fd09c; --ok-soft:#1a3525; color-scheme:dark}

*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font:15px/1.45 var(--body)}
.wrap{max-width:1180px;margin:0 auto;padding-inline:20px;padding-block:22px 60px;display:flex;flex-direction:column;gap:16px}
h1,h2,h3{font-family:var(--display);margin:0;text-wrap:balance}
h1{font-size:26px;font-weight:700;letter-spacing:-.01em}
h2{font-size:17px;font-weight:600}
h3{font-size:14px;font-weight:600}
p{margin:0}
.sub{color:var(--muted);margin-top:2px;max-width:64ch}
.muted{color:var(--muted)}
.mono{font-family:var(--mono);font-size:12.5px}
button,input,select{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.head{display:flex;flex-wrap:wrap;gap:12px 24px;align-items:flex-end;justify-content:space-between}
.who{display:flex;flex-wrap:wrap;gap:8px;align-items:center;font-size:13px;color:var(--muted)}
.notice{background:var(--warn-soft);border-left:3px solid var(--warn);padding:9px 12px}
.pill{display:inline-block;font-size:12px;font-weight:600;padding:2px 8px;border-radius:10px;white-space:nowrap}
.pill.ok{background:var(--ok-soft);color:var(--ok)} .pill.bad{background:var(--crit-soft);color:var(--crit)} .pill.warn{background:var(--warn-soft);color:var(--warn)} .pill.off{background:var(--sunk);color:var(--muted)}

.sum{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));border:1px solid var(--line);background:var(--surface);border-radius:var(--r);margin:0}
.sum div{padding:12px 16px;border-left:1px solid var(--line);min-width:0}
.sum div:first-child{border-left:0}
.sum dt{font-size:11.5px;letter-spacing:.07em;text-transform:uppercase;color:var(--muted)}
.sum dd{margin:2px 0 0;font:700 26px/1.1 var(--display);font-variant-numeric:tabular-nums;overflow-wrap:anywhere}
.sum dd small{font:400 13px var(--body);color:var(--muted)}
.sum .c dd{color:var(--crit)}
@media (max-width:640px){.sum{grid-template-columns:repeat(2,minmax(0,1fr))}.sum div:nth-child(3){border-left:0}.sum div:nth-child(n+3){border-top:1px solid var(--line)}.sum dd{font-size:21px}}

.sech{display:flex;align-items:center;gap:12px;flex-wrap:wrap;padding-bottom:12px;border-bottom:1px solid var(--line)}
.sech .ic{width:40px;height:40px;border-radius:10px;background:var(--accent-soft);color:var(--accent);display:grid;place-items:center}.sech .ic svg{width:22px;height:22px}
.sech h2{font-size:21px}
.back{display:inline-flex;align-items:center;gap:6px}.back svg{width:16px;height:16px}
.tabs{display:flex;gap:2px;border-bottom:1px solid var(--line);overflow-x:auto;scrollbar-width:thin}
@media (min-width:760px){.tabs{flex-wrap:wrap;overflow:visible}.tabs button{padding:10px 9px}}
.tabs button{display:inline-flex;align-items:center;gap:7px;background:none;border:0;border-bottom:3px solid transparent;padding:10px 12px;font:600 14.5px var(--display);color:var(--muted);cursor:pointer;white-space:nowrap}
.tabs button:hover{color:var(--ink)}
.tabs button svg{width:18px;height:18px;flex:none}
.tabs button[aria-selected="true"]{color:var(--accent);border-bottom-color:var(--accent)}
.ico{fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.brand{display:flex;gap:14px;align-items:center;min-width:0}
.logo{width:46px;height:46px;flex:none;border-radius:12px;background:var(--accent);color:var(--accent-ink);display:grid;place-items:center}
.logo svg{width:26px;height:26px}
.org{font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:600}
.hello{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:flex-end;gap:8px;margin-bottom:14px}
.hello h2{font-size:22px}
.tiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:14px}
.tile{display:flex;flex-direction:column;align-items:flex-start;gap:10px;text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:18px 18px 16px;cursor:pointer;color:var(--ink);font:inherit;transition:border-color .15s,box-shadow .15s,transform .15s;min-height:168px}
.tile:hover{border-color:var(--accent);box-shadow:0 6px 18px rgba(13,40,34,.10);transform:translateY(-2px)}
.tile .ic{width:46px;height:46px;border-radius:12px;background:var(--accent-soft);color:var(--accent);display:grid;place-items:center}
.tile .ic svg{width:25px;height:25px}
.tile h3{font-size:16.5px}
.tile p{color:var(--muted);font-size:13px;line-height:1.4}
.tile .ts{margin-top:auto;font-size:12.5px;font-weight:600;color:var(--ink);display:flex;gap:6px;align-items:center}
.tile .ts .dot{width:8px;height:8px;border-radius:50%;background:var(--muted)}
.tile .ts .dot.ok{background:var(--ok)}.tile .ts .dot.warn{background:var(--warn)}
@media (max-width:520px){.tiles{grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}.tile{padding:14px;min-height:150px}.tile p{display:none}}
.bar{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.bar .grow{flex:1 1 180px;min-width:0}
.btn{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:7px 12px;font-weight:500;cursor:pointer;white-space:nowrap}
.btn:hover{border-color:var(--accent)}
.btn.pri{background:var(--accent);border-color:var(--accent);color:var(--accent-ink);font-weight:600}
.btn.sm{padding:4px 9px;font-size:13px}
.btn.link{border:0;background:none;padding:0;color:var(--accent);text-decoration:underline}
.btn:disabled{opacity:.5;cursor:default}
input[type=search],input[type=text],input[type=email],input[type=password],input[type=number],select{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:7px 9px;min-width:0}
input.d{width:74px;text-align:right}
label.chk{display:inline-flex;gap:6px;align-items:center;white-space:nowrap}
.dfilt{margin-bottom:12px}
.kpis{display:grid;grid-template-columns:1.4fr repeat(3,minmax(0,1fr));gap:12px;margin-bottom:16px}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px 16px;min-width:0}
.kl{font-size:12.5px;color:var(--muted)}.kv{font:600 26px/1.15 var(--body);margin-top:4px;overflow-wrap:anywhere}.kv small{font:400 13px var(--body);color:var(--muted)}
.kpi.hero .kv{font-size:48px;line-height:1.05}.kd{font-size:13px;margin-top:6px}.kd .up{color:var(--up);font-weight:600}.kd .down{color:var(--down);font-weight:600}
@media (max-width:900px){.kpis{grid-template-columns:repeat(2,minmax(0,1fr))}.kpi.hero{grid-column:1/-1}}
.dgrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px}.dgrid .full{grid-column:1/-1}
@media (max-width:899px){.dgrid{grid-template-columns:minmax(0,1fr)}}
.dcard{padding:14px 18px 16px;min-width:0}.dhead{display:flex;justify-content:space-between;gap:10px;align-items:flex-start;margin-bottom:8px}
.dcard h3{margin:0;font:600 15px var(--body)}.dcard h4{margin:12px 0 4px;font:600 13px var(--body)}.dhead p{margin:2px 0 0;font-size:12.5px}
.dnote{font-size:13px;margin:0 0 10px;padding:8px 10px;background:var(--sunk);border-radius:var(--r)}
.dbody2{overflow-x:auto}.dbody2 svg{display:block;max-width:none}
.dsec{margin:26px 0 12px;font:600 18px var(--display)}
.dtable{overflow:auto;max-height:420px}
th.loc{color:var(--ink);font-weight:600}.rem-ok,.rem-lo,.rem-hi{white-space:nowrap}.rem-ok{color:var(--up);font-weight:600}.rem-lo{color:var(--down);font-weight:600}.rem-hi{color:var(--warn);font-weight:600}td.tcol{background:var(--sunk)}table.mini{min-width:0}.hscroll{overflow-x:auto;min-width:0}.kmini{grid-template-columns:repeat(4,minmax(0,1fr))}.kmini .kv{font-size:22px}table.xyz td{vertical-align:top;line-height:1.35}table.xyz td small{color:var(--muted)}
@media (max-width:900px){.kmini{grid-template-columns:repeat(2,minmax(0,1fr))}}table.mini td:first-child{min-width:190px}table.mini td,table.mini th{padding:6px 8px;font-size:13px}
.legend{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:12.5px;color:var(--muted);margin:2px 0 8px}.legend i{display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:5px;vertical-align:-1px}
.vg{stroke:var(--vgrid);stroke-width:1}.vb{stroke:var(--vaxis);stroke-width:1}.vt{fill:var(--muted);font-size:11px;font-variant-numeric:tabular-nums}
.vlab{fill:var(--ink);font-size:12px}.vv{fill:var(--ink);font-size:12px;font-weight:600;font-variant-numeric:tabular-nums}
.vl{fill:none;stroke:var(--s1);stroke-width:2;stroke-linejoin:round;stroke-linecap:round}.va{fill:var(--s1);opacity:.1}.vd{fill:var(--s1);stroke:var(--surface);stroke-width:2}
.xh{stroke:var(--vaxis);stroke-width:1}.hit{fill:transparent;outline:none}.hit:hover,.hit:focus{fill:var(--ink);fill-opacity:.04}
.seg{display:flex;height:28px;gap:2px;margin:6px 0 4px}.seg div{border-radius:4px;display:flex;align-items:center;padding:0 8px;min-width:2px;overflow:hidden}.seg span{color:#fff;font-size:12px;font-weight:600;white-space:nowrap}
.dtip{position:fixed;z-index:60;pointer-events:none;background:var(--surface);color:var(--ink);border:1px solid var(--line);border-radius:var(--r);box-shadow:0 6px 20px rgba(0,0,0,.18);padding:8px 10px;font-size:12.5px;max-width:300px}
.dtip .tt{color:var(--muted);margin-bottom:4px}.dtip .tr{display:flex;align-items:center;gap:6px;white-space:nowrap}.dtip i{display:inline-block;width:10px}.dtip i.ln{height:2px}.dtip i.bx{height:10px;border-radius:2px}.dtip b{font-variant-numeric:tabular-nums}
.filt{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin:0 0 12px;font-size:13px}
.ms{position:relative}.ms .btn.on{border-color:var(--accent);background:var(--accent-soft);font-weight:600}
.mspan{position:absolute;z-index:30;top:calc(100% + 4px);left:0;width:min(340px,calc(100vw - 32px));background:var(--surface);border:1px solid var(--line);border-radius:var(--r,8px);box-shadow:0 6px 24px rgba(0,0,0,.15);padding:10px;display:flex;flex-direction:column;gap:8px}
.mspan input[type=search],.mspan textarea{width:100%;box-sizing:border-box}.mspan textarea{height:56px;min-height:56px;resize:vertical}
.mslist{max-height:260px;overflow:auto;display:flex;flex-direction:column;gap:4px}.mslist label.chk{white-space:normal;align-items:flex-start}
.msbar{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
label.fld{display:flex;flex-direction:column;gap:4px;font-size:13px;color:var(--muted)}
label.fld input{color:var(--ink);font-size:15px}

.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--r)}
.pad{padding:16px 18px;display:flex;flex-direction:column;gap:12px}
.scroll{overflow:auto;max-height:calc(100vh - 140px)}
.scroll thead{position:sticky;top:0;z-index:3}
.scroll thead th{background:var(--surface);box-shadow:inset 0 -1px 0 var(--line)}
.scroll tbody td:first-child,.scroll thead th:first-child{position:sticky;left:0;z-index:2}
.scroll tbody td:first-child{background:var(--surface)}
.scroll thead th:first-child{z-index:4}
.scroll tr.work td:first-child{background:var(--sunk)}
.wk .scroll{max-height:none}
.wk .scroll thead{position:static}
.wk .scroll tbody td:first-child,.wk .scroll thead th:first-child{position:static}
table{border-collapse:collapse;width:100%;min-width:720px}
th{font-size:11.5px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);font-weight:500;text-align:left;padding:8px 12px;border-bottom:1px solid var(--line);white-space:nowrap}
td{padding:8px 12px;border-bottom:1px solid var(--line);vertical-align:middle}
tbody tr:last-child td{border-bottom:0}
th.n,td.n{text-align:right;font-variant-numeric:tabular-nums}
th.g,td.g{border-left:1px solid var(--line)}
td.big{font:600 15px var(--display)}
td .nm{font-weight:500}
td .mt{font-size:12.5px;color:var(--muted)}
td.neg{color:var(--crit);font-weight:600}
td.it{min-width:240px}
.mlist{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:6px 16px}
.mlist .chk{white-space:normal}
.behind{color:var(--crit)} .ahead{color:var(--ok)} .warnc{color:var(--warn)} td.behind .mt,td.ahead .mt{color:var(--muted)}
.share{display:block;height:6px;background:var(--sunk);border-radius:2px;margin-top:4px;min-width:90px}
.share i{display:block;height:100%;background:var(--accent);border-radius:2px}
.tw{background:none;border:0;cursor:pointer;padding:2px 6px;color:var(--muted);font-size:12px}
tr.work td{background:var(--sunk);padding:12px 16px}
.wk{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px 28px}
@media (max-width:760px){.wk{grid-template-columns:minmax(0,1fr)}}
.wk ol{margin:0;padding:0;list-style:none;font-size:13.5px}
.wk li{display:flex;justify-content:space-between;gap:12px;padding:4px 0;border-bottom:1px solid var(--line)}
.wk li span:last-child{font-variant-numeric:tabular-nums;white-space:nowrap}
.wk li.tot{border-bottom:0;font-weight:600}
.empty{padding:34px 20px;text-align:center;display:flex;flex-direction:column;gap:10px;align-items:center}
.empty p{color:var(--muted);max-width:56ch}

/* the five uploads */
.ups{list-style:none;margin:0;padding:0}
.ups li{display:grid;grid-template-columns:34px minmax(0,1.5fr) minmax(0,1.2fr) auto;gap:6px 16px;align-items:center;padding:14px 18px;border-bottom:1px solid var(--line)}
.ups li:last-child{border-bottom:0}
.ups .no{font:700 20px var(--display);color:var(--muted)}
.ups .st{font-size:13px;color:var(--muted);display:flex;flex-direction:column;gap:3px;align-items:flex-start}
@media (max-width:820px){.ups li{grid-template-columns:34px minmax(0,1fr)}.ups .st,.ups .bar{grid-column:2}}
.rule{font:500 14px var(--mono);background:var(--sunk);padding:10px 12px;border-radius:var(--r);overflow-wrap:anywhere}
.auth{max-width:420px;margin:24px auto;width:100%}

dialog{border:1px solid var(--line);border-radius:8px;background:var(--surface);color:var(--ink);padding:0;width:min(560px,calc(100vw - 32px))}
dialog::backdrop{background:rgba(10,18,15,.55)}
.dbody{padding:18px 20px;display:flex;flex-direction:column;gap:12px}
.drow{display:flex;flex-wrap:wrap;gap:8px;justify-content:flex-end}
textarea{width:100%;min-height:200px;font:12.5px var(--mono);background:var(--surface);color:var(--ink);border:1px solid var(--line);border-radius:var(--r);padding:8px}
#toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:9px 14px;border-radius:var(--r);max-width:calc(100vw - 32px);z-index:50}
</style>

</head>
<body>
<div class="wrap">
  <div class="head">
    <div class="brand"><div class="logo" aria-hidden="true"><svg viewBox="0 0 24 24" class="ico"><path d="M3 7.5 12 3l9 4.5v9L12 21l-9-4.5z"/><path d="M3 7.5 12 12l9-4.5M12 12v9"/></svg></div>
      <div><p class="org">Universal Corporation Ltd · SCM Planning</p><h1>Reorder Desk</h1></div>
    </div>
    <div class="who" id="who"></div>
  </div>
  <div id="note"></div>
  <dl class="sum" id="sum" hidden></dl>
  <div class="tabs" role="tablist" id="tabs" hidden></div>
  <div class="sech" id="sech" hidden></div>
  <div class="filt" id="filt" hidden></div>
  <main id="view"></main>
</div>
<input type="file" id="file" accept=".xlsx,.xlsm,.xls,.csv" hidden><input type="file" id="ssfile" accept=".xlsx,.xls,.csv" hidden><input type="file" id="mailfile" accept=".xlsx,.xls,.csv" hidden>
<dialog id="dlgUp"><div class="dbody"><h2 id="upTitle">Upload</h2><div id="upBody" class="pad" style="padding:0"></div>
  <div class="drow"><button class="btn" id="upDone" data-close>Cancel</button><button class="btn pri" id="upSave" disabled>Save</button></div></div></dialog>
<dialog id="dlgAsk"><div class="dbody"><h2 id="askTitle">Are you sure?</h2><p id="askText" class="sub"></p>
  <div class="drow"><button class="btn" id="askNo">Cancel</button><button class="btn pri" id="askYes">Delete</button></div></div></dialog>
<dialog id="dlgCopy"><div class="dbody"><h2>Copy this order</h2><p class="sub">Select the text and copy it.</p><textarea id="copyText" readonly></textarea>
  <div class="drow"><button class="btn" data-close>Close</button></div></div></dialog>
<div id="toast" hidden role="status"></div><div id="dtip" class="dtip" hidden role="tooltip"></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<script src="config.js"></script>
<script>
"use strict";
/*CORE-START*/
const Core=(()=>{
  const num=v=>{if(typeof v==="number")return isFinite(v)?v:0;if(v==null||v==="")return 0;const n=parseFloat(String(v).replace(/[,₹\s]/g,""));return isFinite(n)?n:0};
  const key=s=>String(s??"").toLowerCase().replace(/&/g,"and").replace(/[^a-z0-9]+/g,"");
  const up=x=>{const y=Number(x.toFixed(6));return y>0?Math.ceil(y):0};
  const DEPOTS=[["Chennai",5,1,1],["Coimbatore",5,1,1],["Bangalore",5,1,1],["Hyderabad",5,2,1],["Cochin",5,2,1],["Ahmedabad",5,4,1],["Man'Dip",5,4,1],["Pune",5,4,1],["Bhiwandi",5,4,1],

  }

  /* factory order (one row per item, a column per depot) and factory dispatch (one row per dispatch), both in cartons; stored in pcs = cartons × case lot */
  function parseFactory(kind,sheets,cfg,opt){const DI=depotIndex(cfg),A=collector(),unknown=[],bad=new Set(),warn=[],used=[],bd={noDate:0};
    const lotOf=opt.lotOf||(()=>1);let od=null,hasHead=false;
    for(const s of sheets){const h=headerRow(s.grid);if(!h)continue;hasHead=true;
      if(kind==="factory"){const r=wideInto(A,s.grid,DI,()=>"Order",unknown,null);if(r>0){used.push(s.name);
          const dc=h.ks.findIndex(k=>DATE_KEYS.includes(k));if(dc>=0&&!od)for(let r2=h.r+1;r2<s.grid.length&&!od;r2++)od=isoDate((s.grid[r2]||[])[dc])}}
      else{const fx=kind==="dispatch"?"Dispatch":"Plan",r=longInto(A,s.grid,DI,()=>fx,bad,fx,null,kind==="dispatch"?bd:null);
        if(r>=0)used.push(s.name);else if(r===-3)warn.push(`Sheet “${s.name}” has no Dispatch Date column, so it was not read.`);
        else if(r===-2)warn.push(`Sheet “${s.name}” needs a Qty column.`);else warn.push(`Sheet “${s.name}” has no Location column, so it was not read.`)}}
    const out=A.done();
    if(!out.n)return {error:warn[0]||(hasHead?"No depot columns were recognised. Download the template to see the layout.":NOHEAD)};
    if(!out.depots.size)return {error:warn[0]||(bad.size?`No location names matched the depots in Settings. Found: ${[...bad].slice(0,6).join(", ")}.`:"No depot columns were recognised. Download the template to see the layout.")};
    cfg.depots.forEach(d=>{if(!out.depots.has(d.id))out.depots.set(d.id,{fields:[],v:[]})});
    const L=out.codes.map(c=>{if(kind==="ecomplan")return 1;const l=num(lotOf(c));return l>0?l:0});  /* the Ecom direct plan is uploaded in pcs already */let noLot=0,ctn=0;
    out.codes.forEach((c,j)=>{let any=false;out.depots.forEach(d=>d.v.forEach(a=>{if(a[j])any=true}));if(any&&!L[j])noLot++});
    out.depots.forEach(d=>{d.v=d.v.map(a=>a.map((x,j)=>{ctn+=x;return x*(L[j]||1)}))});
    let pcs=0;out.depots.forEach(d=>d.v.forEach(a=>a.forEach(x=>pcs+=x)));
    if(noLot)warn.push(`${noLot} item codes have no Case Lot in the item master (or are not in it), so 1 carton (or case) is counted as 1 pc for them.`);
    let range=[];if(kind==="dispatch"){const ds=new Set();out.depots.forEach(d=>d.fields.forEach(f=>{if(f!=="nodate")ds.add(f)}));range=[...ds].sort();
      if(bd.noDate)warn.push(`${bd.noDate} rows have no readable Dispatch Date. They are counted as dispatched against the current order.`)}
    return {kind,...out,replaceAll:true,fg:null,unknown,badDepots:[...bad],warn,sheets:used,ctn,pcs,range,noDate:bd.noDate,orderDate:od}}

  /* factory FG: one row per item, Item Code and FG qty in cases; stored in pcs = cases × case lot */
  function parseFG(sheets,opt,kind){const lotOf=opt.lotOf||(()=>1),pos=new Map(),codes=[],q=[],used=[],warn=[];let hasHead=false,noLot=0,cs=0;
    for(const s of sheets){const h=headerRow(s.grid);if(!h)continue;hasHead=true;
      let qc=h.ks.findIndex((k,i)=>i!==h.c&&(QTY_KEYS.includes(k)||/qty|quantity|fg|stock|cases?$/.test(k)));if(qc<0)continue;used.push(s.name);
      for(let r=h.r+1;r<s.grid.length;r++){const row=s.grid[r]||[],code=String(row[h.c]??"").trim();if(!code)continue;
        if(!pos.has(code)){pos.set(code,codes.length);codes.push(code);q.push(0)}q[pos.get(code)]+=num(row[qc])}}
    if(!codes.length)return {error:hasHead?"No Qty column was found next to Item Code. Download the template to see the layout.":NOHEAD};
    const v=q.map((x,j)=>{cs+=x;const l=num(lotOf(codes[j]));if(!(l>0)&&x)noLot++;return x*(l>0?l:1)});
    if(noLot)warn.push(`${noLot} item codes have no Case Lot in the item master (or are not in it), so 1 case is counted as 1 pc for them.`);
    let pcs=0;v.forEach(x=>pcs+=x);
    return {kind:kind||"fg",codes,n:codes.length,depots:new Map([["all",{fields:[kind==="dplan"?"Plan":"FG"],v:[v]}]]),replaceAll:true,fg:null,unknown:[],badDepots:[],warn,sheets:used,ctn:cs,pcs}}

  /* sales history: one row per item, month, channel and depot (pcs). Stored per month and depot; an upload replaces only the months in it. */
  const MONTH_KEYS=["month","mon","period","salemonth","salesmonth","monthyear","yearmonth","date","invoicedate","billingdate","billdate","saledate","bom"];
  const MON3="janfebmaraprmayjunjulaugsepoctnovdec";
  function monthOf(v){if(v==null||v==="")return null;const p=n=>String(n).padStart(2,"0"),d=isoDate(v);if(d)return d.slice(0,7);
    const s=String(v).trim();let m=s.match(/^(\d{4})[-\/. ](\d{1,2})$/);if(m&&+m[2]>=1&&+m[2]<=12)return `${m[1]}-${p(m[2])}`;
    m=s.match(/^(\d{1,2})[-\/. ](\d{4})$/);if(m&&+m[1]>=1&&+m[1]<=12)return `${m[2]}-${p(m[1])}`;
    m=s.match(/^([A-Za-z]{3,})[-\/. ,']*(\d{2,4})$/);if(m){const mo=MON3.indexOf(m[1].slice(0,3).toLowerCase())/3+1;if(mo>0)return `${m[2].length===2?"20"+m[2]:m[2]}-${p(mo)}`}
    m=s.match(/^(\d{2,4})[-\/. ]([A-Za-z]{3,})$/);if(m){const mo=MON3.indexOf(m[2].slice(0,3).toLowerCase())/3+1;if(mo>0)return `${m[1].length===2?"20"+m[1]:m[1]}-${p(mo)}`}
    return null}
  function parseHist(sheets,cfg){const DI=depotIndex(cfg),known=cfg.saleCh||[],byM=new Map(),bad=new Set(),warn=[],used=[];let rows=0,noMonth=0,hasHead=false,total=0;const codes=new Set();
    for(const s of sheets){const h=headerRow(s.grid);if(!h)continue;hasHead=true;const f=keys=>h.ks.findIndex((k,i)=>i!==h.c&&keys.includes(k));
      const dc=f(DEPOT_KEYS),cc=f(CH_KEYS);let mc=-1;for(const mk of MONTH_KEYS){mc=h.ks.findIndex((k,i)=>i!==h.c&&k===mk);if(mc>=0)break}  /* first by priority: Month before Date before BOM */let qc=f(QTY_KEYS);if(qc<0)qc=h.ks.findIndex((k,i)=>i!==h.c&&/qty|quantity/.test(k));
      if(dc<0||cc<0||mc<0||qc<0){warn.push(`Sheet “${s.name}” needs Month, Sales Channel, Depot and Qty columns, so it was not read.`);continue}used.push(s.name);
      for(let r=h.r+1;r<s.grid.length;r++){const row=s.grid[r]||[],code=String(row[h.c]??"").trim();if(!code)continue;
        const mo=monthOf(row[mc]);if(!mo){noMonth++;continue}const dn=String(row[dc]??"").trim(),dep=DI.exact.get(key(dn));if(!dep){bad.add(dn||"(blank)");continue}
        const ch=chLabel("sale",row[cc],known);if(!ch)continue;const q=num(row[qc]);let A=byM.get(mo);if(!A)byM.set(mo,A=collector());A.add(code,dep,ch,q);rows++;total+=q;codes.add(code)}}
    if(!rows)return {error:warn[0]||(bad.size?`No depot names matched Settings. Found: ${[...bad].slice(0,6).join(", ")}.`:hasHead?"No rows with a month, depot and qty were found. Download the template to see the layout.":NOHEAD)};
    if(noMonth)warn.push(`${noMonth} rows have no readable Month and were skipped.`);
    const months=[...byM.keys()].sort(),out=new Map();months.forEach(m=>out.set(m,byM.get(m).done()));
    return {kind:"hsale",cfgDepots:cfg.depots.map(d=>d.id),months,byMonth:out,n:codes.size,rows,total,codes:[...codes],depots:new Map(),badDepots:[...bad],unknown:[],warn,sheets:used,replaceAll:false,fg:null}}

  /* the documents one upload writes: one per depot, so a file with only some depots updates only those */
  function toDocs(p,stamp){
    if(p.kind==="hsale"){const out=[];  /* one compact record per month: r = [item, depot, channel, qty, ...], split into parts of about 150 KB */
      p.byMonth.forEach((A,m)=>{const deps=[...A.depots.keys()],chs=[],ci=new Map(),r=[];
        deps.forEach((id,di)=>{const d=A.depots.get(id);d.fields.forEach((f,fj)=>{if(!ci.has(f)){ci.set(f,chs.length);chs.push(f)}const c=ci.get(f),a=d.v[fj];for(let i=0;i<a.length;i++)if(a[i])r.push(i,di,c,+a[i].toFixed(4))})});
        const est=JSON.stringify(r).length+JSON.stringify(A.codes).length,parts=Math.max(1,Math.ceil(est/150000)),per=Math.ceil(r.length/4/parts)*4||4;
        for(let k=0;k<parts;k++){const d={month:m,part:k,parts,r:r.slice(k*per,(k+1)*per),...stamp};if(!k){d.codes=A.codes;d.deps=deps;d.chs=chs}out.push({col:"hsale",id:k?m+"~"+k:m,data:d})}});
      out.push({col:"meta",id:"hsale",data:{...stamp,rows:p.n,depots:[],months:p.months}});return out}
    if(p.kind==="dstock"){const out=[];p.byDate.forEach((D,d)=>out.push(...packParts("dstock",d,{date:d,codes:D.codes,locs:p.locs},D.r,3,stamp)));
      out.push({col:"meta",id:"dstock",data:{...stamp,rows:p.n,depots:[],dates:p.dates}});return out}
    if(p.kind==="mtloss"){const out=[];p.byMonth.forEach((M,m)=>out.push(...packParts("mtloss",m,{month:m,codes:M.codes,locs:M.locs,dates:M.dates},M.r,4,stamp)));
      out.push({col:"meta",id:"mtloss",data:{...stamp,rows:p.n,depots:[],months:p.months}});return out}
    if(p.kind==="mdmap")return [{col:"cfg",id:"mdmap",data:{rows:p.rows,...stamp}},{col:"meta",id:"mdmap",data:{...stamp,rows:p.n,depots:[]}}];
    if(p.kind==="items")return [{col:"master",id:"items",data:{...p.cols,...stamp}},{col:"meta",id:"items",data:{...stamp,rows:p.n,depots:[]}}];
    const pack=(fields,v)=>{const o={};v.forEach((a,j)=>o["c"+j]=a);return {codes:p.codes,fields,v:o,...stamp}};
    const out=[];p.depots.forEach((d,id)=>out.push({col:p.kind,id,data:p.kind==="factory"?{...pack(d.fields,d.v),od:p.orderDate||""}:pack(d.fields,d.v)}));
    if(p.kind==="po"){const pd=p.podate;if(pd)pd.depots.forEach((d,id)=>out.push({col:"podate",id,data:{...sparse(pd.codes,d.v),fields:d.fields,...stamp}}));
      else out.push({col:"podate",id:"_none",data:{none:true,...stamp}})}
    if(p.fg)out.push({col:"stock",id:"_fg",data:pack(["FG"],[p.fg])});
    out.push({col:"meta",id:p.kind,data:{...stamp,rows:p.n,depots:p.kind==="fg"||p.kind==="dplan"||p.kind==="ecomsku"?[]:[...p.depots.keys()],...(p.kind==="factory"?{od:p.orderDate||""}:{})}});

  }

  const sumAt=(doc,j)=>{if(!doc||j<0)return 0;let s=0;for(let k=0;k<doc.fields.length;k++)s+=doc.v["c"+k][j]||0;return s};
  const at=(doc,k,j)=>doc&&j>=0&&k>=0&&doc.v["c"+k]?(doc.v["c"+k][j]||0):0;
  function index(doc,pos,n){const idx=new Int32Array(n).fill(-1);let miss=0;if(doc)doc.codes.forEach((c,j)=>{const i=pos.get(String(c));if(i==null)miss++;else idx[i]=j});return {idx,miss}}

  /* D = {cfg, items, forecast:Map, stock:Map, sale:Map, po:Map}. Order = forecast x cover days / working days + open PO - physical - transit. */
  function compute(D){
    const it=D.items,n=it?it.code.length:0,pos=new Map();for(let i=0;i<n;i++)pos.set(String(it.code[i]),i);
    const total=new Array(n).fill(0),miss={forecast:0,stock:0,sale:0,po:0};
    const depots=D.cfg.depots.map(d=>{
      const days=num(d.safety)+num(d.transit)+num(d.freq),cover=days/(num(D.cfg.workDays)||26);
      const docs={forecast:D.forecast.get(d.id),stock:D.stock.get(d.id),sale:D.sale.get(d.id),po:D.po.get(d.id)},ix={};
      for(const k in docs){const r=index(docs[k],pos,n);ix[k]=r.idx;miss[k]=Math.max(miss[k],r.miss)}
      const o={id:d.id,name:d.name,days,cover,docs,ix,fc:[],po:[],phy:[],transit:[],reserved:[],sale:[],need:[],raw:[],qty:[],cases:0,cs:0,lines:0,cbm:0,wt:0};
      for(let i=0;i<n;i++){
        const fc=sumAt(docs.forecast,ix.forecast[i]),po=sumAt(docs.po,ix.po[i]),sj=ix.stock[i],phy=at(docs.stock,0,sj),tr=at(docs.stock,1,sj);
        const lot=D.pcsLot?D.pcsLot[i]:1,need=fc*cover,raw=need+po-phy-tr,qty=up(raw/lot)*lot;
        o.fc.push(fc);o.po.push(po);o.phy.push(phy);o.transit.push(tr);o.reserved.push(at(docs.stock,2,sj));o.sale.push(sumAt(docs.sale,ix.sale[i]));o.need.push(need);o.raw.push(raw);o.qty.push(qty);
        if(qty>0){const cs=qty/lot;o.cases+=qty;o.cs+=cs;o.lines++;o.cbm+=cs*it.cbm[i];o.wt+=cs*it.wgt[i]/1000;total[i]+=qty}
      }
      return o;
    });
    let fg=null;const fd=D.stock.get("_fg");
    if(fd){const {idx}=index(fd,pos,n);fg=[];for(let i=0;i<n;i++){const have=at(fd,0,idx[i]);if(total[i]>0)fg.push({i,have,want:total[i],bal:have-total[i]})}}
    return {n,depots,total,fg,miss};
  }
  /* case lot per item: Case Lot from the item master, 1 when missing */
  function lots(items){return items.code.map((_,i)=>{const l=num(items.csLot[i]);return l>0?l:1})}
  /* the same uploads in cases: every quantity divided by the item's case lot */
  function toCases(m,lotOf){const out=new Map();m.forEach((doc,id)=>{if(!doc||!Array.isArray(doc.codes)){out.set(id,doc);return}
    const L=doc.codes.map(c=>lotOf(c)),v={};Object.keys(doc.v).forEach(k=>{v[k]=doc.v[k].map((x,j)=>(x||0)/L[j])});out.set(id,{...doc,v})});return out}
  /* per-channel figures behind one order line */
  function detail(dep,i){const list=k=>{const doc=dep.docs[k],j=dep.ix[k][i];return doc?doc.fields.map((f,c)=>[f,at(doc,c,j)]):[]};
    return {forecast:list("forecast"),po:list("po"),sale:list("sale")}}

  const union=(base,res,k)=>{const out=[],seen=new Set(),add=f=>{const x=key(f);if(!seen.has(x)){seen.add(x);out.push(f)}};(base||[]).forEach(add);res.depots.forEach(d=>d.docs[k]&&d.docs[k].fields.forEach(add));return out};
  const pick=(dep,k,i,f)=>{const doc=dep.docs[k];if(!doc)return 0;const c=doc.fields.findIndex(x=>key(x)===key(f));return c<0?0:at(doc,c,dep.ix[k][i])};

  /* the master file: item details, then one block of columns per depot */
  function masterAoa(D,res,unit){unit=unit||"Pcs";
    const it=D.items,fc=union(D.cfg.fcCh,res,"forecast"),po=union(D.cfg.poCh,res,"po"),sl=union(D.cfg.saleCh,res,"sale");
    const base=ITEM_COLS.map(c=>c[1]).concat(it.members?["Item numbers"]:[],`Total Order (${unit})`);
    const block=[...fc.map(f=>"Fcst "+f),"Total Forecast",...po.map(f=>"PO "+f),"Total Open PO","Phy Stock","Transit Stock","Reserved Stock",...sl.map(f=>"Sale "+f),"Total MTD Sale","Cover Days",`Order (${unit})`];
    const r1=base.map(()=>""),r2=base.slice(),merges=[];
    res.depots.forEach((d,k)=>{const s=base.length+k*block.length;r1.push(d.name,...block.slice(1).map(()=>""));r2.push(...block);merges.push({s:{r:0,c:s},e:{r:0,c:s+block.length-1}})});
    const aoa=[r1,r2];
    for(let i=0;i<res.n;i++){const row=ITEM_COLS.map(([f])=>it[f]?it[f][i]:"");if(it.members)row.push(it.members[i]);row.push(res.total[i]);
      res.depots.forEach(d=>{row.push(...fc.map(f=>pick(d,"forecast",i,f)),d.fc[i],...po.map(f=>pick(d,"po",i,f)),d.po[i],d.phy[i],d.transit[i],d.reserved[i],...sl.map(f=>pick(d,"sale",i,f)),d.sale[i],d.days,d.qty[i])});
      aoa.push(row)}
    return {aoa,merges,blockLen:block.length,baseLen:base.length};
  }
  /* ---- Final Code: every item number is counted under its Final Code (item master); a blank Final Code means the item number itself ---- */
  const FINAL_COLS=["forecast","direct","stock","sale","po","podate","factory","dispatch","fg","ecomplan","dplan","ecomsku"];
  function finalMap(it){if(!it||!Array.isArray(it.fcode))return null;const m=new Map();let changed=false;
    it.code.forEach((c,i)=>{const k=String(c).trim(),f=String(it.fcode[i]??"").trim()||k;m.set(k,f);if(f!==k)changed=true});return changed?m:null}
  /* one document (codes + fields + v) with its codes turned into Final Codes; figures of item numbers sharing a Final Code are added */
  function remapDoc(doc,m){if(!doc||!Array.isArray(doc.codes)||!m)return doc;const codes=[],pos=new Map(),ix=doc.codes.map(c=>{const k=String(c).trim(),f=m.get(k)||k;if(!pos.has(f)){pos.set(f,codes.length);codes.push(f)}return pos.get(f)});
    if(codes.length===doc.codes.length&&codes.every((f,j)=>f===String(doc.codes[j]).trim()))return doc;
    const v={};Object.keys(doc.v||{}).forEach(k=>{const a=doc.v[k]||[],o=new Array(codes.length).fill(0);for(let j=0;j<a.length;j++){const x=+a[j];if(x)o[ix[j]]+=x}v[k]=o});
    return {...doc,codes,v}}
  /* the data as the reports see it: one item per Final Code (details and Case Lot from the Final Code's own row, else its first item number; name = Final Item Name) */
  function consolidate(D){const it=D.items,m=finalMap(it);if(!m)return {D,map:null,groups:0};
    const order=[],rep=new Map(),members=new Map();it.code.forEach((c,i)=>{const k=String(c).trim(),f=m.get(k);if(!rep.has(f)){rep.set(f,i);order.push(f);members.set(f,[])}if(k===f)rep.set(f,i);members.get(f).push(k)});
    const items={...it};ITEM_COLS.forEach(([f])=>{if(Array.isArray(it[f]))items[f]=order.map(fc=>it[f][rep.get(fc)])});
    items.code=order.slice();items.name=order.map(fc=>{const i=rep.get(fc),n=String(it.fname&&it.fname[i]||"").trim();return n||it.name[i]});
    items.members=order.map(fc=>members.get(fc).join(", "));
    const out={...D,items};FINAL_COLS.forEach(k=>{const mp=D[k];if(mp instanceof Map){const n=new Map();mp.forEach((doc,id)=>n.set(id,remapDoc(doc,m)));out[k]=n}});
    return {D:out,map:m,groups:order.length}}

  /* order sheet with both units; unit says what d.qty holds ("pcs" or "cs") */
  function orderAoa(D,res,k,unit){const it=D.items,d=res.depots[k],L=lots(it),rows=[["Item Code","Item Name","Brand","Category","Case Lot","Order (Pcs)","Order (Cases)","CBM","Weight (kg)"]];
    for(let i=0;i<res.n;i++)if(d.qty[i]>0){const pcs=unit==="cs"?d.qty[i]*L[i]:d.qty[i],cs=pcs/L[i];rows.push([it.code[i],it.name[i],it.brand[i],it.cat[i],L[i],Math.round(pcs),+cs.toFixed(3),+(cs*it.cbm[i]).toFixed(3),+(cs*it.wgt[i]).toFixed(1)])}return rows}
  function templateBook(kind,D){
    const cfg=D.cfg,items=D.items?D.items.code.map((c,i)=>[c,D.items.name[i]]):[],dn=cfg.depots.map(d=>d.name);
    const lists=extra=>["Lists",[["Depot",...extra.map(e=>e[0])],...dn.map((d,i)=>[d,...extra.map(e=>e[1][i]??"")])]];
    if(kind==="items")return [["Item master",[ITEM_COLS.map(c=>c[1])]]];
    if(kind==="dstock"){const d=new Date(Date.now()-86400000),p=n=>String(n).padStart(2,"0"),dd=`${p(d.getDate())}-${p(d.getMonth()+1)}-${d.getFullYear()}`;
      const fc=D.items?(D.items.fcode||D.items.code).map((c,i)=>String(c||D.items.code[i])):[],seen=new Set(),rows=[];fc.forEach((c,i)=>{if(seen.has(c))return;seen.add(c);rows.push([dd,c,(D.items.fname&&D.items.fname[i])||D.items.name[i]])});
      return [["Date-wise stock",[["Date","Final Code","Final Name",...LOSS_LOCS],...rows]]]}
    if(kind==="mtloss"){const t=Date.now(),p=n=>String(n).padStart(2,"0"),ds=Array.from({length:30},(_,i)=>i+1).map(k=>{const d=new Date(t-k*86400000);return `${p(d.getDate())}-${p(d.getMonth()+1)}-${d.getFullYear()}`});
      return [["MT loss",[["Location","Item code","Item name",...ds]]]]}
    if(kind==="mdmap")return [["Mother depot",[["Location","Depot","Mother Depot 1","Mother Depot 2"],...LOSS_LOCS.map(l=>[l,(cfg.depots.find(d=>d.id===guessDep(l,cfg))||{name:""}).name,"",""])]],
      ["Depots",[["Depot names you can use"],...dn.map(d=>[d])]]];
    if(kind==="lsale")kind="sale";

    let id=d.id||Core.key(name)||"depot";while(seen.has(id))id+="2";seen.add(id);
    depots.push({id,name,safety:Core.num(d.safety),transit:Core.num(d.transit),freq:Core.num(d.freq)})}
  const ssBrand={},ssBrandLabels={},labels=new Map(brandList());

  const cfg={workDays:Math.min(31,Math.max(1,Math.round(Core.num(e.workDays))||26)),drrDays:Math.min(31,Math.max(0,Math.round(Core.num(e.drrDays)))),ecomAge:Math.max(0,Math.round(Core.num(e.ecomAge))),fgMin:Math.max(0,Core.num(e.fgMin)),mtPct:Math.min(100,Math.max(0,Core.num(e.mtPct))),ssBrand,ssBrandLabels,depots,fcCh:list(e.fcCh),saleCh:list(e.saleCh),poCh:list(e.poCh)};

  const a=t.dataset.act,R=S.res,k=R?R.depots.findIndex(l=>l.id===S.loc):-1;

$("mailfile").addEventListener("change",async ev=>{const f=ev.target.files[0];if(!f)return;
  try{const wb=XLSX.read(await f.arrayBuffer(),{type:"array"}),g=XLSX.utils.sheet_to_json(wb.Sheets[wb.SheetNames[0]],{header:1,defval:null});
    const hr=g.findIndex(r=>(r||[]).some(x=>/mail/.test(Core.key(x))));if(hr<0)throw new Error("No 'Email' heading found. Use the downloaded sheet: Name, Email.");
    const H=g[hr].map(Core.key),ec=H.findIndex(k=>/mail/.test(k)),nc=H.findIndex(k=>k==="name"||k==="membername"||k==="fullname");
    const seen=new Set(),people=[],bad=[];
    g.slice(hr+1).forEach(r=>{const em=String((r||[])[ec]??"").trim().toLowerCase();if(!em)return;if(!/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(em)){bad.push(em);return}if(seen.has(em))return;seen.add(em);people.push({name:nc>=0?String(r[nc]??"").trim():"",email:em})});
    if(!people.length)throw new Error("No email addresses found under the heading.");
    await Store.setMany([{col:"mail",id:"list",data:{people,at:new Date().toISOString(),by:S.me||""}}]);S.snd.to=null;
    toast(`${people.length} addresses saved${bad.length?`. Skipped, not an email address: ${bad.slice(0,3).join(", ")}`:""}.`)}

$("ssfile").addEventListener("change",async ev=>{const f=ev.target.files[0];if(!f)return;

    const hr=g.findIndex(r=>(r||[]).some(x=>Core.key(x)==="brand"));if(hr<0)throw new Error("No 'Brand' heading found. Use the downloaded safety days sheet.");
    const H=g[hr].map(Core.key),bc=H.indexOf("brand"),ed=editCfg(),cols=ed.depots.map(d=>H.indexOf(Core.key(d.name)));
